ext.BugsyReactNative = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return BugsyReactNative[prop]
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}


apply plugin: "com.facebook.react"

android {
  namespace "com.bugsyreactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }
}

// Pinned to the latest bugsy release on Maven Central; synced with the npm package version
// per the strategy documented in DEB-94.
ext.bugsyNativeVersion = "0.4.0"

dependencies {
  implementation "com.facebook.react:react-android"
  // addBugsyInterceptor() no-ops in release builds on its own (BugsyContext.isHostDebuggable()),
  // so a single implementation() covers both build types.
  implementation "io.github.gabriela-miranda-leite:bugsy-core-android:${bugsyNativeVersion}"
  implementation "io.github.gabriela-miranda-leite:bugsy-ui-android:${bugsyNativeVersion}"
}
